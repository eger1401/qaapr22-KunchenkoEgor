<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свояк — экран</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; font-size: clamp(16px, 1.6vw, 28px); }
  .top h1 { font-size: 1.4em; }
  #stage { display: grid; align-content: center; gap: 2vh; min-height: 0; }
  .board { gap: .5vw; }
  .board .trow { gap: .5vw; }
  .board .theme { font-size: .9em; padding: 1vh 1vw; border-radius: .6vw; }
  .board .cell { font-size: 1.6em; padding: 1.4vh 0; border-radius: .6vw; }
  .big-q { font-size: clamp(28px, 4vw, 72px); line-height: 1.2; font-weight: 600; text-align: center; text-wrap: balance; max-width: 30ch; margin: 0 auto; }
  .q-meta { text-align: center; display: flex; gap: 1em; justify-content: center; align-items: baseline; font-size: 1.2em; }
  .who { font-family: var(--display); font-size: 2.4em; text-align: center; color: var(--buzz); }
  .ans { font-family: var(--display); font-size: 2.4em; text-align: center; color: var(--good); }
  .open-ind { text-align: center; font-family: var(--display); color: var(--buzz); font-size: 1.4em; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .bar { display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center; }
  .pl { background: var(--bg-2); border: 1px solid var(--line); border-radius: .8vw; padding: 1vh 1.4vw; min-width: 10ch; text-align: center; }
  .pl b { display: block; font-weight: 600; }
  .pl span { font-family: var(--display); font-size: 1.5em; font-variant-numeric: tabular-nums; }
  .pl.answering { border-color: var(--buzz); background: rgba(255,77,94,.2); }
  .pl.chooser { border-color: var(--gold); }
  .join { text-align: center; display: grid; gap: 2vh; }
  .join code { font-family: var(--display); color: var(--gold); font-size: 2.4em; word-break: break-all; }
  .timer { max-width: 40vw; width: 100%; margin: 0 auto; height: 1vh; }
  .q-img { max-height: 45vh; }
  #sound { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); }
  .fin { display: grid; gap: 1vh; max-width: 60ch; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
  <div class="top"><h1>Свояк</h1><span id="round" class="muted"></span><span id="conn" class="dot"></span></div>
  <div id="stage"></div>
  <div id="bar" class="bar"></div>
  <button id="sound" class="btn small ghost" type="button">Включить звук</button>
<script src="client.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const e = S.esc;
let lastKey = '';
let prevAnswering = null;
const audio = new Audio();
let lastMediaNonce; // undefined до первого состояния
// браузер разрешает звук только после нажатия на странице
$('#sound').addEventListener('click', () => {
  S.beep(660, 120); // любое нажатие разрешает странице играть звук
  $('#sound').hidden = true;
});
function syncAudio(st) {
  const m = st.media;
  const nonce = m ? m.nonce : null;
  if (nonce === lastMediaNonce) return;
  const first = lastMediaNonce === undefined;
  lastMediaNonce = nonce;
  if (!st.q || !(st.q.audio || st.q.melody) || !m || !m.playing || first) { audio.pause(); S.stopMelody(); return; }
  if (st.q.melody) { S.playMelody(st.q.melody, st.q.bpm); return; }
  audio.src = S.mediaUrl(st.q.audio);
  audio.currentTime = 0;
  audio.play().catch(() => { $('#sound').hidden = false; });
}

if (S.ONLINE && !S.room()) {
  $('#stage').innerHTML = `<form id="roomForm" class="card" style="max-width:420px;margin:0 auto;width:100%">
    <label class="label" for="roomInput">Код комнаты (есть на пульте ведущего)</label>
    <input id="roomInput" type="text" maxlength="6" autocapitalize="characters" autocomplete="off" required>
    <button class="btn gold" type="submit">Показать табло</button></form>`;
  $('#roomForm').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const u = new URL(location.href);
    u.searchParams.set('room', $('#roomInput').value.toUpperCase().replace(/[^A-Z0-9]/g, ''));
    location.href = u.href;
  });
} else S.connect({ role: 'screen' }, (st) => {
  syncAudio(st);
  if (st.phase !== 'question' && st.phase !== 'reveal') { if (!audio.paused) audio.pause(); S.stopMelody(); }
  $('#round').textContent = st.phase === 'lobby' ? '' : st.phase.startsWith('final') ? 'Финал' : st.board.name;
  $('#bar').innerHTML = st.players.map((p) => `<div class="pl${p.id === st.answering ? ' answering' : ''}${p.id === st.chooser && st.phase === 'board' ? ' chooser' : ''}">
    <b>${e(p.name)}</b><span class="${p.score < 0 ? 'neg' : ''}">${p.score}</span></div>`).join('');
  if (st.answering && st.answering !== prevAnswering) S.beep(990, 250);
  prevAnswering = st.answering;
  const key = JSON.stringify([st.finalSelect, st.phase, st.board, st.q, st.buzzOpen, st.answering, st.chooser, st.final, st.phase === 'lobby' || st.phase === 'end' ? st.players : 0]);
  if (key === lastKey) return;
  lastKey = key;
  $('#stage').innerHTML = stage(st);
}, (on, msg) => {
  $('#conn').classList.toggle('on', on);
  if (!on && msg && !$('#stage').innerHTML) $('#stage').innerHTML = `<div class="q-meta muted">${e(msg)}</div>`;
});

function stage(st) {
  const f = st.final;
  switch (st.phase) {
    case 'lobby':
      if (S.ONLINE) {
        const link = SvoyakOnline.link('play.html', S.room());
        setTimeout(() => S.qrSvg(link, 6).then((svg) => { const q = document.getElementById('qr'); if (q) q.innerHTML = svg; }));
        return `<div class="join"><div class="muted">Наведите камеру телефона на код или откройте ссылку</div>
          <div id="qr" style="background:#fff;border-radius:1vw;padding:1vw;width:min(28vh,60vw);margin:0 auto"></div>
          <div>Код комнаты: <span class="price" style="font-size:1.6em;letter-spacing:.12em">${e(S.room())}</span></div>
          <div class="muted" style="font-size:.8em;word-break:break-all">${e(link)}</div>
          <div>${st.players.length ? 'Уже в игре: ' + st.players.map((p) => e(p.name)).join(', ') : 'Пока никого'}</div></div>`;
      }
      return `<div class="join"><div class="muted">Заходите в игру с телефона — откройте в браузере:</div>
        <code>${e(location.host)}/play</code>
        <div>${st.players.length ? 'Уже в игре: ' + st.players.map((p) => e(p.name)).join(', ') : 'Пока никого'}</div></div>`;
    case 'board':
      return `<div class="q-meta"><span>Выбирает:</span><b>${e(S.nameOf(st, st.chooser))}</b></div>` + S.boardHtml(st);
    case 'question':
    case 'reveal': {
      const q = st.q;
      let h = `<div class="q-meta"><span class="muted">${e(q.theme)}</span><span class="price">${q.price}</span></div>
        ${q.type !== 'normal' ? `<div style="display:flex;justify-content:center">${S.specialHtml(q)}</div>` : ''}
        ${q.type === 'auction' ? `<div class="q-meta">${q.stake ? 'Ставка: <span class="price">' + q.stake + '</span>' : (q.staker ? e(S.nameOf(st, q.staker)) + ' делает ставку…' : '')}</div>` : ''}
        <div class="big-q">${e(q.text)}</div>${S.imageHtml(q)}`;
      if (st.phase === 'reveal') return h + `<div class="ans">${e(q.answer)}</div>`;
      if (st.answering) return h + `<div class="who">${e(S.nameOf(st, st.answering))}</div>`;
      if (st.buzzOpen) return h + '<div class="open-ind">Жмите!</div>';
      return h;
    }
    case 'final-select': {
      const fs = st.finalSelect;
      return `<div class="q-meta"><span class="muted">Финал: убираем темы</span></div>
        <div class="q-meta">Убирает: <b>${e(S.nameOf(st, fs.turn))}</b> · осталось ${fs.options.filter((o) => !o.removed).length}</div>
        <div style="max-width:1100px;margin:0 auto;width:100%">${S.finalGridHtml(fs, false)}</div>`;
    }
    case 'final-bets':
      return `<div class="q-meta"><span class="muted">Финал</span></div><div class="big-q">${e(f.theme)}</div>
        <div class="q-meta muted">Ставки: ${f.players.filter((p) => p.hasBet).length} из ${f.players.length}</div>`;
    case 'final-question':
      return `<div class="q-meta"><span class="muted">Финал · ${e(f.theme)}</span></div><div class="big-q">${e(f.text)}</div>
        <div class="q-meta muted">Ответили: ${f.players.filter((p) => p.hasAnswer).length} из ${f.players.length}</div>`;
    case 'final-reveal':
      return `<div class="q-meta"><span class="muted">Финал · ${e(f.theme)}</span></div><div class="big-q" style="font-size:2em">${e(f.text)}</div>
        ${f.answer ? `<div class="ans">${e(f.answer)}</div>` : ''}
        <div class="fin">${f.players.map((p) => `<div class="score-row"><span class="nm">${e(S.nameOf(st, p.id))}${p.answer !== undefined ? ' — «' + e(p.answer || '…') + '»' : ''}</span>
          <span>${p.ok === undefined ? '…' : `<span style="color:var(${p.ok ? '--good' : '--bad'})">${p.ok ? '+' : '−'}${p.bet}</span>`}</span></div>`).join('')}</div>`;
    case 'end': {
      const top = [...st.players].sort((a, b) => b.score - a.score)[0];
      return `<div class="q-meta muted">Победитель</div><div class="who" style="color:var(--gold);font-size:4em">${top ? e(top.name) : '—'}</div>
        ${top ? `<div class="q-meta"><span class="price" style="font-size:2em">${top.score}</span></div>` : ''}`;
    }
  }
  return '';
}
</script>
</body>
</html>
