<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Свояк</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero { text-align: center; padding-block: 8vh 4vh; display: grid; gap: 10px; }
  .hero h1 { font-size: clamp(44px, 14vw, 88px); color: var(--gold); }
  .roles { display: grid; gap: 12px; }
  .roles a { text-decoration: none; display: grid; gap: 4px; text-align: left; padding: 18px; }
  .roles a b { font-family: var(--display); font-weight: 400; font-size: 20px; }
  .roles a span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .roles a.gold span { color: #4a3a00; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>Свояк</h1>
    <p class="muted" id="sub">Викторина для компании в одной Wi‑Fi сети</p>
  </div>
  <div class="roles">
    <a class="btn gold" href="play.html"><b>Я игрок</b><span>Кнопка, вопросы и свой счёт на телефоне</span></a>
    <a class="btn" href="host.html"><b>Я ведущий</b><span id="hostHint">Нужен PIN из окна сервера</span></a>
    <a class="btn ghost" href="screen.html"><b>Большой экран</b><span>Табло для телевизора или ноутбука</span></a>
  </div>
</div>
<script>
if (location.protocol === 'https:' || location.protocol === 'file:') {
  document.getElementById('sub').textContent = 'Онлайн-викторина: ведущий создаёт комнату, игроки заходят по коду';
  document.getElementById('hostHint').textContent = 'Игра будет жить на вашем телефоне';
}
</script>
</body>
</html>
